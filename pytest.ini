[pytest]
# Starlette 1.6.0's TestClient prefers the `httpx2` package and emits a
# StarletteDeprecationWarning when it falls back to `httpx` (which this app
# pins at 0.28.1 for its own runtime HTTP). The fallback is test-only and
# benign — production code never imports starlette.testclient (the middleware
# only references the "testserver"/"testclient" host strings). Suppress just
# this one message so the test output stays clean.
#
# Root-cause alternative: add `httpx2` to the test environment
# (`pip install httpx2`) so the TestClient uses it instead of httpx.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
