name: CI / CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ─── LINT ───────────────────────────────────────────────────────────
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ --output-format=github || true

  # ─── TEST ───────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Admin123
          POSTGRES_DB: carepoint_hms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAREPOINT_HMS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:Admin123@localhost:5432/carepoint_hms_test
      CAREPOINT_HMS_DATABASE_URL: postgresql+psycopg2://postgres:Admin123@localhost:5432/carepoint_hms_test
      CAREPOINT_HMS_MASTER_DATABASE_URL: postgresql+psycopg2://postgres:Admin123@localhost:5432/carepoint_hms_test
      CAREPOINT_HMS_ENVIRONMENT: test
      CAREPOINT_HMS_SECRET_KEY: ci-only-secret-key-do-not-use-in-production-2026
      CAREPOINT_HMS_RATE_LIMIT_ENABLED: 'false'
      CAREPOINT_HMS_EMAILS_ENABLED: 'false'
      CAREPOINT_HMS_SMS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock python-dotenv

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run tests
        run: pytest app/tests/integration -x --tb=short -q --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  # ─── DEPLOY TO PRODUCTION ──────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ vars.DROPLET_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via script
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_ed25519 \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
              "bash /opt/carepoint_hms/scripts/deploy_backend_droplet.sh deploy main"

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.DROPLET_DOMAIN }}
        if: env.DOMAIN != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://${{ secrets.DROPLET_DOMAIN }}/health" >/dev/null; then
              echo "✓ Production smoke test passed."
              exit 0
            fi
            echo "attempt $i — waiting 5s"
            sleep 5
          done
          echo "::warning::Health check did not respond — service may still be starting."

      - name: Notify deployment
        if: always()
        run: |
          SHA="${{ github.sha }}"
          STATUS="${{ job.status }}"
          echo "Deployment of ${SHA:0:7} finished with status: ${STATUS}"
